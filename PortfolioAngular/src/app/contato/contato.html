<section class="contato-container">
  <h2>Contato</h2>

  <div *ngIf="mensagemSucesso" style="color: green; margin-bottom: 10px;">
    {{ mensagemSucesso }}
  </div>

  <div *ngIf="errosValidacao.length > 0" style="color: red; margin-bottom: 10px;">
    <ul>
      <li *ngFor="let erro of errosValidacao">{{ erro }}</li>
    </ul>
  </div>

  <form (ngSubmit)="onSubmit()" #formContato="ngForm">
    <div>
      <label>Nome:</label><br>
      <input type="text" name="nome" [(ngModel)]="dados.nome" required>
    </div>

    <div>
      <label>E-mail:</label><br>
      <input type="email" name="email" [(ngModel)]="dados.email" required>
    </div>

    <div>
      <label>Mensagem:</label><br>
      <textarea name="mensagem" [(ngModel)]="dados.mensagem" rows="4" required></textarea>
    </div>

    <button type="submit" [disabled]="!formContato.form.valid || enviando">
      {{ enviando ? 'Enviando...' : 'Enviar' }}
    </button>
  </form>
</section>
