<mat-sidenav-container class="container-principal">
  <mat-sidenav #sidenav mode="over" class="menu-lateral">
    <div class="links-lateral">
      <a mat-button routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" (click)="sidenav.close()">
        <mat-icon>home</mat-icon> Início
      </a>
      <a mat-button routerLink="/sobre" routerLinkActive="ativo" (click)="sidenav.close()">
        <mat-icon>person</mat-icon> Sobre
      </a>
      <a mat-button routerLink="/projetos" routerLinkActive="ativo" (click)="sidenav.close()">
        <mat-icon>build</mat-icon> Projetos
      </a>
      <a mat-button routerLink="/catalogo" routerLinkActive="ativo" (click)="sidenav.close()">
        <mat-icon>list_alt</mat-icon> Catálogo
      </a>
      <a mat-button routerLink="/contato" routerLinkActive="ativo" (click)="sidenav.close()">
        <mat-icon>email</mat-icon> Contato
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span>Meu Portfólio</span>
      <span class="espacador"></span>
      
      <a mat-button routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a mat-button routerLink="/sobre" routerLinkActive="ativo">Sobre</a>
      <a mat-button routerLink="/projetos" routerLinkActive="ativo">Projetos</a>
      <a mat-button routerLink="/catalogo" routerLinkActive="ativo">Catálogo</a>
      <a mat-button routerLink="/contato" routerLinkActive="ativo">Contato</a>
    </mat-toolbar>

    <main style="padding: 24px;">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
